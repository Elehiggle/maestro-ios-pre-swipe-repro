appId: dev.maestro.swipewaitminimal
---
- launchApp:
    stopApp: true
    arguments:
      mode: moving
- assertVisible:
    id: repro-first-row
- assertNotVisible:
    id: repro-second-row
- swipe:
    start: 50%, 75%
    end: 50%, 35%
    duration: 700
    waitToSettleTimeoutMs: 500
- assertVisible:
    id: repro-second-row
